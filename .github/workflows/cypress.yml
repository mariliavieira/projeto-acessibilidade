name: Cypress Accessibility

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar Cypress
        run: npx cypress run

      - name: Salvar relatório de acessibilidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-acessibilidade
          path: cypress/results/
